name: Build desktop

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-x64
            os: macos-15-intel
          - name: macos-arm64
            os: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.26.2

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace and tag versions
        run: node scripts/release-tools.mjs check-version

      - name: Verify versioned release notes
        run: node scripts/release-notes.mjs check

      - name: Run checks
        run: pnpm check

      - name: Build and verify desktop runtime
        run: |
          pnpm --filter @contextweave/desktop exec electron-vite build
          pnpm test:desktop --require-native
          pnpm test:app-update

      - name: Verify source-reviewed fingerprint provider on all three platforms
        run: pnpm test:fingerprint --reviewed-provider --require-provider

      - name: Verify official fingerprint browser lifecycle
        if: matrix.name != 'macos-x64'
        run: pnpm test:fingerprint --require-provider

      - name: Build desktop package
        run: pnpm --filter @contextweave/desktop build

      - name: Verify isolated packaged application bundle
        run: pnpm test:desktop --packaged --require-native

      - name: Verify actual hardened executable and utility worker
        run: pnpm test:packaged-native

      - name: Verify fuse rejection with disposable positive controls
        run: pnpm test:packaged-fuses

      - name: Audit packaged dependencies and stage verified artifacts
        run: node scripts/release-tools.mjs stage ${{ matrix.name }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: contextweave-${{ matrix.name }}
          path: release-artifacts/${{ matrix.name }}/**
          if-no-files-found: error
