name: Build desktop

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-x64
            os: macos-15-intel
          - name: macos-arm64
            os: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.26.2

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace and tag versions
        run: node scripts/release-tools.mjs check-version

      - name: Run checks
        run: pnpm check

      - name: Build and verify desktop runtime
        run: |
          pnpm --filter @contextweave/desktop exec electron-vite build
          pnpm test:desktop

      - name: Verify official fingerprint browser lifecycle
        if: matrix.name != 'macos-x64'
        run: pnpm test:fingerprint --require-provider

      - name: Build desktop package
        run: pnpm --filter @contextweave/desktop build

      - name: Verify isolated packaged application bundle
        run: pnpm test:desktop --packaged

      - name: Audit packaged dependencies and stage verified artifacts
        run: node scripts/release-tools.mjs stage ${{ matrix.name }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: contextweave-${{ matrix.name }}
          path: release-artifacts/${{ matrix.name }}/**
          if-no-files-found: error
