name: Release desktop

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-x64
            os: macos-15-intel
          - name: macos-arm64
            os: macos-14

    steps:
      - name: Checkout tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.26.2

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace and tag versions
        run: node scripts/release-tools.mjs check-version

      - name: Verify versioned release notes
        run: node scripts/release-notes.mjs check

      - name: Run checks
        run: pnpm check

      - name: Build and verify desktop runtime
        run: |
          pnpm --filter @contextweave/desktop exec electron-vite build
          pnpm test:desktop --require-native

      - name: Verify official fingerprint browser lifecycle
        if: matrix.name != 'macos-x64'
        run: pnpm test:fingerprint --require-provider

      - name: Build desktop package
        run: pnpm --filter @contextweave/desktop build

      - name: Verify isolated packaged application bundle
        run: pnpm test:desktop --packaged --require-native

      - name: Verify actual hardened executable and utility worker
        run: pnpm test:packaged-native

      - name: Verify fuse rejection with disposable positive controls
        run: pnpm test:packaged-fuses

      - name: Audit packaged dependencies and stage verified artifacts
        run: node scripts/release-tools.mjs stage ${{ matrix.name }}

      - name: Upload validated release notes
        if: matrix.name == 'macos-arm64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: notes-${{ github.ref_name }}
          path: docs/releases/${{ github.ref_name }}.md
          if-no-files-found: error

      - name: Upload build result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: release-${{ matrix.name }}
          path: release-artifacts/${{ matrix.name }}/**
          if-no-files-found: error

  source-sbom:
    name: Inventory source dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source for SBOM
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Generate source SPDX (not a binary SBOM)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          syft-version: v1.52.0
          format: spdx-json
          output-file: contextweave.source.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload source inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: release-source-sbom
          path: contextweave.source.spdx.json
          if-no-files-found: error

  publish:
    name: Prepare draft GitHub Release
    needs: [build, source-sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          pattern: release-*
          path: artifacts
          merge-multiple: false

      - name: Download validated release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          name: notes-${{ github.ref_name }}
          path: release-notes

      - name: Validate artifact set and platform checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(find artifacts -type f | wc -l)" -eq 13
          test -s artifacts/release-source-sbom/contextweave.source.spdx.json
          for target in windows-x64 macos-x64 macos-arm64; do
            (cd "artifacts/release-$target" && sha256sum --check "SHA256SUMS-$target.txt")
          done

      - name: Create draft for release verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="release-notes/${GITHUB_REF_NAME}.md"
          test -s "$notes"
          IFS= read -r title < "$notes"
          [[ "$title" == "# ContextWeave ${GITHUB_REF_NAME} · "* ]]
          mapfile -d '' files < <(find artifacts -type f -print0)
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${title#\# }" \
            --verify-tag --draft --notes-file "$notes"
          echo 'Draft created. Verify downloaded assets and release notes before publishing.'
