name: Release desktop

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-x64
            os: macos-15-intel
          - name: macos-arm64
            os: macos-14

    steps:
      - name: Checkout tag
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      - name: Build and verify desktop runtime
        run: |
          pnpm --filter @contextweave/desktop exec electron-vite build
          pnpm test:desktop

      - name: Verify official fingerprint browser lifecycle
        if: matrix.name != 'macos-x64'
        run: pnpm test:fingerprint --require-provider

      - name: Build desktop package
        run: pnpm --filter @contextweave/desktop build

      - name: Generate SHA-256 files on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseRoot = Join-Path $PWD 'apps/desktop/release'
          $versionRoot = Get-ChildItem -LiteralPath $releaseRoot -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $versionRoot) { throw "No electron-builder output directory found" }
          $stagingRoot = Join-Path $PWD 'release-artifacts/windows-x64'
          New-Item -ItemType Directory -Force -Path $stagingRoot | Out-Null
          Get-ChildItem -LiteralPath $versionRoot.FullName -File |
            Where-Object { $_.Extension -eq '.exe' } |
            Copy-Item -Destination $stagingRoot
          Get-ChildItem -LiteralPath $stagingRoot -File |
            Where-Object Name -ne 'SHA256SUMS-windows-x64.txt' |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLowerInvariant(), (Split-Path -Leaf $_.Path) } |
            Set-Content -LiteralPath (Join-Path $stagingRoot 'SHA256SUMS-windows-x64.txt') -Encoding utf8

      - name: Generate SHA-256 files on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version_root="$(find apps/desktop/release -mindepth 1 -maxdepth 1 -type d -print | sort | tail -n 1)"
          test -n "$version_root"
          mkdir -p "release-artifacts/${{ matrix.name }}"
          find "$version_root" -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' \) \
            -exec cp {} "release-artifacts/${{ matrix.name }}/" \;
          cd "release-artifacts/${{ matrix.name }}"
          shasum -a 256 *.dmg *.zip > "SHA256SUMS-${{ matrix.name }}.txt"

      - name: Upload build result
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.name }}
          path: release-artifacts/${{ matrix.name }}/**
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source for SBOM
        uses: actions/checkout@v5

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: false

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: contextweave.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' files < <(find artifacts -type f -print0)
          files+=("contextweave.spdx.json")
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ContextWeave ${GITHUB_REF_NAME}" \
            --generate-notes
